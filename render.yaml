# Render Blueprint: New > Blueprint > pick this repo. Creates one free web service.
services:
  - type: web
    name: trading-ws-simulator
    runtime: node
    plan: free
    buildCommand: npm ci && npm run fetch-real
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TICKS_PER_SECOND
        value: "3000"
      - key: STOCK_COUNT
        value: "3000"
      # Real company names: set this in the Render dashboard (not committed). Without it, all stocks are generated.
      - key: REAL_STOCKS_URL
        sync: false
